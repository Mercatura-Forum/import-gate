name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # typescript 5.x installed at the repo root: extract.mjs resolves it by
      # walking up from its own location, so the parser-path tests run too.
      - run: npm install --no-save typescript@5
      - run: pip install -e . pytest
      - run: pytest -q

  # the action, proven on itself: a clean tree must pass, a broken tree must
  # fail AND leave an error annotation — asserted, not assumed
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clean fixture passes
        uses: ./
        with:
          root: .github/fixtures/clean
      - name: broken fixture fails
        id: broken
        continue-on-error: true
        uses: ./
        with:
          root: .github/fixtures/broken
      - name: the failure actually happened
        if: steps.broken.outcome != 'failure'
        run: |
          echo "the broken fixture did not fail the gate"
          exit 1
