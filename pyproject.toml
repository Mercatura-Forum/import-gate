[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "import-gate"
version = "0.1.0"
description = "Deterministic import validation for generated TypeScript — catch TS2307 before the build runs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["typescript", "imports", "codegen", "llm", "validation", "ts2307"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
import-gate = "import_gate.cli:main"

[project.urls]
Repository = "https://github.com/Mercatura-Forum/import-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
import_gate = ["extract.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
